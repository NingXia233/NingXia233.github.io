---
layout: default
---

<div class="gallery">
  {% for item in site.gallery %}
    <div class="gallery-item">
      <a href="{{ item.url | relative_url }}">
        <img src="{{ item.image | relative_url }}" alt="{{ item.title }}">
        <div class="gallery-item-overlay">
          <span class="gallery-item-title">{{ item.title }}</span>
        </div>
      </a>
    </div>
  {% endfor %}
</div>
