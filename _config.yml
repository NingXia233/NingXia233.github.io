# Site Build Settings

# jekyll-paginate configuration
paginate:            6

# Build settings
markdown:            kramdown
theme:               null
highlighter:         rouge
permalink:           /:title
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

kramdown:
  input: GFM
  math_engine: mathjax
  math_engine_opts:
    preview: false
  tables: false

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title:		           'Ning'
description:	       'Personal Blog'
author:              'Ning Xia'
url:                 'https://ningxia233.github.io'
baseurl:             ''
lang:                'zh-CN'

# Public messages are stored in this repository; no comment server is needed.
comments:
  enabled: true
  repository: NingXia233/NingXia233.github.io
  # Enable after installing https://github.com/apps/giscus on this repository.
  # Fixed discussion #2 already exists. Number mapping does not need a category ID.
  giscus:
    enabled: true
    repository_id: R_kgDOOB13OQ
    category: ''
    category_id: ''
    # Fixed number keeps the homepage and /guestbook/ on the same discussion.
    discussion_number: 2
    term: homepage-guestbook

exclude:
  - README.md
  - LICENSE.md
  - lagrange.gemspec
  - tests

collections:
  gallery:
    output: true

include:
  - "_posts/post_image"
